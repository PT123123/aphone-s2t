plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '2.0.21'
    id 'com.google.devtools.ksp' version '2.0.21-1.0.27'
}

// Release signing — only applied when keystore.properties + release.p12 exist locally.
// Absent those, a bare clone still builds debug / runs tests without a signing key.
def keystorePropFile = rootProject.file('keystore.properties')
def hasReleaseSigning = keystorePropFile.exists()
def releaseSigningProps = new Properties()
if (hasReleaseSigning) { keystorePropFile.withInputStream { releaseSigningProps.load(it) } }

android {
    namespace 'com.example.aphones2t'
    compileSdk 34
    // Pin an installed NDK — AGP 8.1.4's default (r23) is not on this machine, and
    // the ndk{abiFilters} block below needs an NDK present to resolve ABIs.
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.example.aphones2t"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Streaming ASR is CPU-bound; keep the two most common ABIs to limit APK size.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseSigningProps['storeFile'])
                storePassword releaseSigningProps['storePassword']
                keyAlias releaseSigningProps['keyAlias']
                keyPassword releaseSigningProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) { signingConfig signingConfigs.release }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        jniLibs {
            // The Kotlin API only needs the JNI lib, not the (large) C/C++ API libs.
            excludes += ["**/libsherpa-onnx-c-api.so", "**/libsherpa-onnx-cxx-api.so"]
        }
        resources {
            excludes += [
                "META-INF/LICENSE.md",
                "META-INF/LICENSE-notice.md"
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'

    // Lifecycle (viewmodel + coroutines on main)
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'

    // Reliable model download with pause/resume + failure recovery
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // On-device streaming ASR (streaming Paraformer bilingual zh-en)
    implementation 'com.github.k2-fsa:sherpa-onnx:v1.13.4'

    // HTTP Range downloads
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // tar.bz2 extraction for model archives
    implementation 'org.apache.commons:commons-compress:1.27.1'

    // Transcript history
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    ksp 'androidx.room:room-compiler:2.6.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
